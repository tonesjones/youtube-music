[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm-hygiene"
version = "0.1.0"
description = "Keep YouTube Music playlists audio-only and curated, with an Obsidian song log."
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.12,<2",
    "rapidfuzz>=3.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
app = ["nicegui==3.18.0", "pywebview==6.2.1"]
build = ["pyinstaller==6.22.3"]
dev = ["pytest>=8", "ytm-hygiene[app]"]

[project.scripts]
ytm-hygiene = "ytm_hygiene.cli:main"
ytm-hygiene-app = "ytm_hygiene.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
