[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytm-hygiene"
version = "0.1.0"
description = "Swap music videos for audio-only songs in YouTube Music playlists."
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.12,<2",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytm-hygiene = "ytm_hygiene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
